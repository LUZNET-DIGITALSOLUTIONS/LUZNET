  <script>
 
// Intersection Observer para activar animaciones al entrar en pantalla
const hijos = document.querySelectorAll('.hijo');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      // Reiniciar animación CSS: quitar y volver a poner la clase
      entry.target.classList.remove('activo');
      void entry.target.offsetWidth; // fuerza reflow
      entry.target.classList.add('activo');

      // Para hijo4: activar efecto Matrix cada vez que aparece
      if (entry.target.classList.contains('hijo4')) {
        prepararMatrixTexto();
      }
    }
  });
}, { threshold: 0.5 });

hijos.forEach(hijo => observer.observe(hijo));



  </script>
