<head>

<meta property="og:title" content="Graduación Generación 2024-2026 | Prepa Tec">
<meta property="og:description" content="Ceremonia de Graduación. Sábado 15 de Julio, 11:00 AM. Auditorio Principal">

<title>Graduación 2026 | Prepa Tec</title>
  
  <style>
    body {
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .envelope {
      position: relative;
      width: 340px;
      height: 250px;
      background: url("https://i.ibb.co/bg17jz9C/image-1774828666687.jpg") no-repeat center center;
      background-size: cover;
      overflow: hidden;
      perspective: 1200px;
    }
    .seal {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      cursor: pointer;
      z-index: 3;
      animation: zoomSeal 2.5s ease-in-out infinite;
    }
    .seal img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }
    @keyframes zoomSeal {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.15); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
    .sobre { position: absolute; bottom: 0; width:100%; height: 100%; }
    .invitation { opacity: 0; transition: opacity 1s ease 0.5s; }
   
    .flap {
  position: absolute;
  top: 0;
  width: 100%;
  height: 50%;
  background: url("https://i.ibb.co/bg17jz9C/image-1774828666687.jpg") no-repeat center top;
  background-size: cover;
  transform-origin: top;
  transition: transform 1s ease;
  z-index: 2;
}
    
  </style>
</head>
<body>

  <div class="envelope">
    <div class="flap"></div>
    <div class="seal" onclick="openEnvelope()">
      <img src="https://i.ibb.co/N2KBNZ5P/1775109395492.png" alt="Abrir invitacion">
    </div>
    <div class="sobre">
      <div class="invitation"></div>
    </div>
  </div>
  
  <div id="sobreAbierto" style="display:none; text-align:center;">
    <img src="https://i.ibb.co/pBCV70dL/1775109153563.png" alt="Sobre abierto" style="max-width:100%; height:auto;">
  </div>
  
  <audio id="audioSeal" src="https://dl.dropbox.com/scl/fi/f62hfvox43hrsidg9hjha/te-invito-a-mi-fiesta.mp3?rlkey=3uek03kdcxmv6hlacqkvwaxo9&st=72lk0lkr&dl=1"></audio>
  
  <script>
    function openEnvelope() {
      document.querySelector('.flap').style.transform = 'rotateX(-180deg)';
      document.querySelector('.invitation').style.opacity = '1';
      document.getElementById("audioSeal").play();
      
      setTimeout(function() {
        document.querySelector('.envelope').style.display = "none";
        document.getElementById("sobreAbierto").style.display = "block";
      }, 1000);
      
      setTimeout(function() {
        window.location.href = "basica.html"; 
      }, 2200);
    }
  </script>

</body>
</html>
