.hijo {

.hijo::before {

.hijo * {

font-size: 1.5rem;

/* Clases activadas por Intersection Observer */
.hijo.activo { opacity: 1; }
.hijo1 h1 { opacity: 0; }
.hijo1 p { opacity: 0; }
.hijo1.activo h1 { animation: textoDerechaIzquierda 2s forwards; }
.hijo1.activo p { animation: textoIzquierdaDerecha 2s forwards; }

.hijo2 p { opacity: 0; }
.hijo2.activo p { animation: zoomGiro 3s forwards; }

.hijo3 h1 { opacity: 0; }
.hijo3.activo h1 { animation: fadeIn 2s forwards; }

/* Animaciones */
@keyframes animationcolor {
  0%,100% { color:#FFD700; }
 25% { color:white; }
 50% { color:#FFD700; }
 75% { color:white; }
}

@keyframes textoDerechaIzquierda { from{transform:translateX(50px);opacity:0} to{transform:translateX(0);opacity:1} }
@keyframes textoIzquierdaDerecha { from{transform:translateX(-50px);opacity:0} to{transform:translateX(0);opacity:1} }
@keyframes zoomGiro { from{transform:scale(0) rotate(-180deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes encendidoLento { from{opacity:0} to{opacity:1} }
@keyframes girar { from{transform:rotate(0deg);opacity:0} to{transform:rotate(360deg);opacity:1} }
@keyframes matrixFall {
 0% { transform: translateY(-100%); opacity: 0; }
 50% { opacity: 1; }
 100% { transform: translateY(0); opacity: 1; }
}

/* Imagen dentro del div 3 */
.hijo3 img {
  opacity: 0;

.hijo3.activo img {

/*efecto hijo 3*/

.hijo3.activo {

}

.hijo3.activo h1,

.hijo3 p,
.hijo3 h1 {

}

.hijo3.activo p,
.hijo3.activo h1,
.hijo3.activo a
{
  animation: matrixFall 5s ease forwards,
  animationcolor 10s infinite
}

/*efecto de pixel div 1*/
.hijo1.overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  grid-template-rows: repeat(5, 1fr);
  z-index: 10;
  pointer-events: none;
}

.pixel {
  background: black;
  opacity: 1;
  transition: opacity.1s ease;
  aspect-ratio: 1 / 1;
}

.pixel.hide { opacity: 0; }

/* Zoom iframe hijo2 */
@keyframes zoomIn {
 0% { transform: scale(0.2); opacity: 0; }
 100% { transform: scale(1); opacity: 1; }
}

.hijo2 iframe {

<h1 id="slide-h1" data-text="Enlace">Enlace</h1>

<script>
    function generarPixeles() {
      const overlay = document.querySelector('.hijo1.overlay');
      overlay.innerHTML = "";
      for (let i = 0; i < 200; i++) {
        const px = document.createElement('div');
        px.className = 'pixel';
        overlay.appendChild(px);
      }
    }

    function pixelReveal() {
      const pixels = Array.from(document.querySelectorAll('.hijo1.pixel'));
      for (let i = pixels.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pixels[i], pixels[j]] = [pixels[j], pixels[i]];
      }
      pixels.forEach((px, i) => {
        setTimeout(() => { px.classList.add('hide'); }, i * 10);
      });
    }

    const hijos = document.querySelectorAll('.hijo');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.remove('activo');
          void entry.target.offsetWidth;
          entry.target.classList.add('activo');

          if (entry.target.classList.contains('hijo1')) {
            generarPixeles();
            pixelReveal();
          }
        }
      });
    }, { threshold: 0.5 });

    hijos.forEach(hijo => observer.observe(hijo));
  </script>
