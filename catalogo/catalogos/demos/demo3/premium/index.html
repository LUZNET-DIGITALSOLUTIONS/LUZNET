<script>

        },
        
       
        
        
        
        
       
       
      ];
      let i = 0; // current slide
      let j = testimonials.length; // total slides
      let testimonialContainer = document.getElementById(
        "testimonial-container"
      );
      function next() {
        i = (j + i + 1) % j;
        displayTestimonial();
      }

      function prev() {
        i = (j + i - 1) % j;
        displayTestimonial();
      }
      let displayTestimonial = () => {
        testimonialContainer.innerHTML = `
        <p>${testimonials[i].testimonial}</p>
         <img src=${testimonials[i].image}></img>
        
        `;
      };
      window.onload = displayTestimonial;

  <script>
  
  
    // Observer para activar el efecto cada vez que el div1 entra en pantalla
    document.addEventListener("DOMContentLoaded", () => {
      const targetDiv = document.querySelector(".hijo1");

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            prepararMatrixTexto();
          }
        });
      }, { threshold: 0.5 });

      observer.observe(targetDiv);
    });
    
    
    
  //efecto olas de mar div 2
  function prepararWaveTexto() {
    const p = document.getElementById('wave-text');
    if (!p) return;

    const texto = p.textContent;
    p.textContent = ''; // limpiar contenido

    // Crear spans para cada letra (incluyendo espacios)
    for (let i = 0; i < texto.length; i++) {
      const span = document.createElement('span');
      span.textContent = texto[i] === " " ? "\u00A0" : texto[i]; // espacio visible
      span.style.animationDelay = `${i * 0.2}s`; // efecto de ola progresivo
      p.appendChild(span);
    }
  }

  prepararWaveTexto();
  
  
  
  // Observer para activar el efecto cada vez que el div2 entra en pantalla
document.addEventListener("DOMContentLoaded", () => {
  const targetDiv = document.querySelector(".hijo2 .tabla-precios");

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("activo");
      } else {
        // opcional: reinicia el efecto al salir
        entry.target.classList.remove("activo");
      }
    });
  }, { threshold: 0.5 });

  observer.observe(targetDiv);
});












function prepararMatrixTexto() {
    const h1 = document.getElementById('matrix-text');
    if (!h1) return;

    const texto = h1.getAttribute('data-text');
    h1.textContent = '';

    // Esto divide por Enter real O por &#10;
    const lineas = texto.split(/\r?\n|&#10;/);

    lineas.forEach((linea, index) => {
        const divLinea = document.createElement('div');
        divLinea.style.display = 'block'; // Forzar que sea bloque

        for (let i = 0; i < linea.length; i++) {
            const span = document.createElement('span');
            span.textContent = linea[i] === " "? "\u00A0" : linea[i];
            const delay = (Math.random() * 1.5 + index * 0.3).toFixed(2);
            span.style.animationDelay = `${delay}s`;
            divLinea.appendChild(span);
        }
        h1.appendChild(divLinea);
    });
}
