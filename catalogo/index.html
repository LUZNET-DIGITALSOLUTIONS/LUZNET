  /* Animación pulsante infinita */
  animation: zoomPulse 2s infinite ease-in-out;
  transition: transform 0.3s, color 0.3s;
}

.hijo6 a:hover {
  transform: scale(1.4);        /* más grande al pasar el mouse */
  color: white;                 /* cambia a blanco */
  
}

/* Animación pulsante */
@keyframes zoomPulse {
  0%   { transform: scale(1); color:deeppink; }
  50%  { transform: scale(1.2); color: blue; }
  100% { transform: scale(1); color:deeppink; }
}

p {
  color: white; 
  font-size: 20px;
  animation: zoomOnce 1.5s ease-out forwards;
}

/* Animación de zoom único */
@keyframes zoomOnce {
  0% {
    transform: scale(0.5); /* empieza más pequeño */
    opacity: 0;            /* invisible al inicio */
  }
  100% {
    transform: scale(1);   /* tamaño normal */
    opacity: 1;            /* visible al final */
  }
}
