    <style>

        :root {

            font-size:30px;

            -webkit-animation-name: shape;

            -webkit-animation-iteration-count: infinite;
            animation-name: shape;   
            animation-duration: 2s; 
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }
        @keyframes shape {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @-webkit-keyframes shape {
            0%{ transform: rotate(0deg); }
            100% { transform: rotate(360deg); }

<script>
// ===== AQUÍ PEGAS TUS URLS DE TUS AUDIOS - Felipe Jiménez =====
const AUDIOS = {
  grupo1: "https://www.dropbox.com/scl/fi/4h9tn6hm2imazqcxz8mku/grupo1.mp3?rlkey=2agrg521if0efayurgmatow7v&st=tsambytk&dl=1",
  grupo2: "https://www.dropbox.com/scl/fi/wcqya0zcd6tbtkwf7vvm1/grupo2.mp3?rlkey=te9supakofj6unxwwitt0tara&st=3s2mrqdv&dl=1",
  grupo3: "https://www.dropbox.com/scl/fi/lxr6zjcs30kqpyc6mld4k/grupo3.mp3?rlkey=87y0f7wkmujr0kgn15un5m8qk&st=4ioe8auc&dl=1",
  inicio: "PEGA AQUÍ TU URL DE INICIO"
};
// ===============================================================

let audioActual = null;

function sonar(event, cual, urlDestino) {
  event.preventDefault();

  var urlAudio = AUDIOS[cual];

  // Si no pusiste URL, que igual abra el grupo para que no se trabe
  if (!urlAudio || urlAudio.includes("PEGA AQUÍ")) {
    window.location.href = urlDestino;
    return;
  }

  // Si ya está sonando otro, lo paramos
  if (audioActual) {
    audioActual.pause();
    audioActual.currentTime = 0;
  }

  audioActual = new Audio(urlAudio);
  audioActual.play().catch(function() {
    // Si el navegador lo bloquea, abre el grupo de todos modos
    window.location.href = urlDestino;
  });

  var yaAbrio = false;
  function abrir() {
    if (!yaAbrio) {
      yaAbrio = true;
      window.location.href = urlDestino;
    }
  }

  // Cuando termina tu audio, abre el grupo
  audioActual.onended = abrir;

  // Respaldo: si tu audio dura mucho, abre a los 3 segundos
  setTimeout(abrir, 3000);
}
</script>
