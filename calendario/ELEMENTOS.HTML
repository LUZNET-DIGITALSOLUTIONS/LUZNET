/*creado por Felipe Jiménez*/
:root {
  --gradient: linear-gradient(-45deg,white, red,black,red,white );
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
   font-family: 'Baloo 2';
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100vh;
    Background-color:BLACK;
    background-size: 10%; 
    flex-wrap: wrap;
}
.card {
padding:  0px 0px 55px ;
border: 1px solid #FFFFFF;
    Background-color:BLACK;
box-shadow: 0 0 10px red, 0 0 20px red, 0 0 90px red, inset 0 0 20px red;
    position: relative;
    width: 400px;
    border-radius: 5px;
    overflow: hidden;
    transition: .5s;
    margin: 15px 20px;
    min-height: 100%;
  background-size: 300%;
  background-image: var(--gradient);
  -webkit-animation: bg-animation 30s infinite;
          animation: bg-animation 30s infinite;
}
@-webkit-keyframes bg-animation {
  0% { background-position: left; }
  50% { background-position: right; }
  100% { background-position: left; }
}
@keyframes bg-animation {
  0% { background-position: left; }
  50% { background-position: right; }
  100% { background-position: left; }
}
.card .description {
width: 100%;
    text-align: center;
}
H1{ font-size: 60px; }
H2{ font-size: 29px; }
A{ font-size: 20px; }
H1,H2,A{
    animation: animate 20s infinite linear;
    text-shadow: -1px 1px white;
}
@keyframes animate
{
    0%,100%{ color: white; }
    25%{ color: deeppink; }
    50%{ color:deepskyblue; }
    75%{ color: black; }
}

div.shape {
position: relative;
Left:140px;

    -webkit-animation-name: shape;

    <body >

<!-- 👇 AQUI VAN TUS 4 AUDIOS, BRO 👇 -->

<script>
// ============================================================
// 👇👇👇 BRO, AQUI PONES TU LINK DE GUARDAR, PERRO - AQUI MERITO 👇👇👇
// 👉 TIENE QUE SER dl.dropboxusercontent.com, NO www.dropbox.com 👈
// ============================================================

// 👇 0. AUDIO PARA GUARDAR - AQUI PONES TU LINK DE "Guardado" / "Elemento guardado", BRO 👇
var URL_AUDIO_GUARDAR = "https://dl.dropboxusercontent.com/scl/fi/qhu1p1w1uywv92tewk036/alta-elementos.mp3?rlkey=hha54q3x0bkmkamivjd7srhk7&st=71oboi0h";

// 👇 1. AUDIO GRUPO 1 - "Ingresando a grupo 1" 👇
var URL_AUDIO_GRUPO1 = "https://dl.dropboxusercontent.com/scl/fi/4h9tn6hm2imazqcxz8mku/grupo1.mp3?rlkey=2agrg521if0efayurgmatow7v&st=tsambytk";

// 👇 2. AUDIO GRUPO 2 - "Ingresando a grupo 2" 👇
var URL_AUDIO_GRUPO2 = "https://dl.dropboxusercontent.com/scl/fi/wcqya0zcd6tbtkwf7vvm1/grupo2.mp3?rlkey=te9supakofj6unxwwitt0tara&st=3s2mrqdv";

// 👇 3. AUDIO GRUPO 3 - "Ingresando a grupo 3" 👇
var URL_AUDIO_GRUPO3 = "https://dl.dropboxusercontent.com/scl/fi/lxr6zjcs30kqpyc6mld4k/grupo3.mp3?rlkey=87y0f7wkmujr0kgn15un5m8qk&st=4ioe8auc";

// 👇 A DONDE VAN CADA UNO 👇
var URL_GRUPO1 = "grupo1.html";
var URL_GRUPO2 = "grupo2.html";
var URL_GRUPO3 = "grupo3.html";

// 👇 FUNCION PARA QUE SUENE Y LUEGO ENTRE, BRO 👇
var yaCambio = false;
function sonarYEntrar(idAudio, urlAudio, urlDestino){
  yaCambio = false;
  var aud = document.getElementById(idAudio);
  aud.src = urlAudio;
  aud.load();
  aud.onended = function(){
    if(!yaCambio){ yaCambio = true; window.location.href = urlDestino; }
  };
  setTimeout(function(){
    if(!yaCambio){ yaCambio = true; window.location.href = urlDestino; }
  }, 3000);
  try{ aud.currentTime = 0; aud.play().catch(function(e){}); }catch(e){}
}

// 👇 BOTONES CON AUDIO, BRO 👇
function irGrupo1(){ sonarYEntrar("audioGrupo1", URL_AUDIO_GRUPO1, URL_GRUPO1); }
function irGrupo2(){ sonarYEntrar("audioGrupo2", URL_AUDIO_GRUPO2, URL_GRUPO2); }
function irGrupo3(){ sonarYEntrar("audioGrupo3", URL_AUDIO_GRUPO3, URL_GRUPO3); }

// 👇 FUNCION PARA SONAR EL AUDIO DE GUARDAR, BRO 👇
function sonarGuardar(){
  var aud = document.getElementById("audioGuardar");
  aud.src = URL_AUDIO_GUARDAR;
  aud.load();
  try{ aud.currentTime = 0; aud.play().catch(function(e){}); }catch(e){}
}

// 👇 UN SOLO HTML QUE DIRECCIONA A LOS 3 SHEETS, BRO 👇
function guardarElemento(){
  var nombre = document.getElementById("nombreElemento").value.trim();
  var grupo = document.getElementById("grupoElemento").value;

  if(nombre == ""){ alert("Bro, escribe el nombre del elemento"); return; }
  if(grupo == ""){ alert("Bro, selecciona el grupo"); return; }

  var hojaDestino = "elementos" + grupo;

  var datos = JSON.parse(localStorage.getItem(hojaDestino) || "[]");
  datos.push({ nombre: nombre, grupo: grupo, fecha: new Date().toLocaleString() });
  localStorage.setItem(hojaDestino, JSON.stringify(datos));

  // 👇 AQUI SUENA TU AUDIO DE GUARDAR, BRO 👇
  sonarGuardar();

  var m = document.getElementById("mensaje");
  m.style.display = "block";
  m.innerText = "✅ GUARDADO EN " + hojaDestino.toUpperCase() + ", BRO";
  document.getElementById("nombreElemento").value = "";
  setTimeout(function(){ m.style.display = "none"; }, 2500);
}
</script>
