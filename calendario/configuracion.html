:root {
  --gradient: linear-gradient(-45deg,white, red,black,red,white );
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
   font-family: 'Baloo 2';
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100vh;
    Background-color:BLACK;
    background-size: 10%; 
    flex-wrap: wrap;
}
.card {
padding:  0px 0px 55px ;
border: 1px solid #FFFFFF;
    Background-color:BLACK;
box-shadow: 0 0 10px red, 0 0 20px red, 0 0 90px red, inset 0 0 20px red;
    position: relative;
    width: 400px;
    border-radius: 5px;
    overflow: hidden;
    transition: .5s;
    margin: 15px 20px;
    min-height: 100%;
  background-size: 300%;
  background-image: var(--gradient);
  -webkit-animation: bg-animation 30s infinite;
          animation: bg-animation 30s infinite;
}
@-webkit-keyframes bg-animation {
  0% { background-position: left; }
  50% { background-position: right; }
  100% { background-position: left; }
}
@keyframes bg-animation {
  0% { background-position: left; }
  50% { background-position: right; }
  100% { background-position: left; }
}
.card .description {
width: 100%;
    text-align: center;
}
H1{ font-size: 60px; }
H2{ font-size: 29px; }
A{ font-size: 19px; }
H1,H2,A{
    animation: animate 20s infinite linear;
    text-shadow: -1px 1px white;
}
@keyframes animate
{
    0%,100%{ color: white; }
    25%{ color: deeppink; }
    50%{ color:deepskyblue; }
    75%{ color: black; }
}

 }

Left:140px;
    width: 60px;

    -webkit-animation-name: shape;   
    -webkit-animation-duration: 1s;
    -webkit-animation-iteration-count: infinite;
    animation-name: shape;   
    animation-duration: 2s; 
    animation-iteration-count: infinite;

}
@keyframes shape {
    0% { transform: rotate(0deg); }

<audio id="audioServicios" preload="auto"></audio>

<script>
/* ============================================================
   FELIPE - AQUI PONES TUS 2 LINKS DE DROPBOX, CARNAL
   👉 TIENEN QUE SER dl.dropboxusercontent.com, NO www.dropbox.com 👈
   Si no, no suena, perro. Ya te paso como queda:
   ============================================================ */

// 👇 1. AUDIO PARA ELEMENTOS - AQUI PONES TU LINK DE ELEMENTOS 👇
var URL_AUDIO_ELEMENTOS = "https://dl.dropboxusercontent.com/scl/fi/1pjic0nwkhzgkshg7lxu9/elementos.mp3?rlkey=ijyzq7jrigb62qairc0g6r6r9&st=1gqcwn99";

// 👇 2. AUDIO PARA SERVICIOS - AQUI PONES TU LINK DE SERVICIOS 👇
var URL_AUDIO_SERVICIOS = "https://dl.dropboxusercontent.com/scl/fi/61uyo5vm25vlp6pbanfrj/servicios.mp3?rlkey=ax9p8pgp4fm3v507nn4xqc68u&st=9gjbtrjy";

// 👇 A DONDE VAN CADA UNO 👇
var URL_ELEMENTOS = "ELEMENTOS.html";
var URL_SERVICIOS = "SERVICIOS.html"; // Si tu archivo se llama diferente, aqui lo cambias, carnal

var yaCambio = false;
function cambiarA(url){
  if(!yaCambio){
    yaCambio = true;
    window.location.href = url;
  }
}

function sonarYEntrar(idAudio, urlAudio, urlDestino){
  yaCambio = false;
  var aud = document.getElementById(idAudio);
  aud.src = urlAudio;
  aud.load();
  aud.onended = function(){ cambiarA(urlDestino); };
  // Si no suena, entra a los 3 segundos para que no se trabe
  setTimeout(function(){ cambiarA(urlDestino); }, 3000);
  try{
    aud.currentTime = 0;
    aud.play().catch(function(e){ console.log("Audio bloqueado"); });
  }catch(e){}
}

// 👇 BOTON 1 - ELEMENTOS 👇
function irElementos(){
  sonarYEntrar("audioElementos", URL_AUDIO_ELEMENTOS, URL_ELEMENTOS);
}

// 👇 BOTON 2 - SERVICIOS 👇
function irServicios(){
  sonarYEntrar("audioServicios", URL_AUDIO_SERVICIOS, URL_SERVICIOS);
}
</script>
